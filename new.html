<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 适配移动端手机浏览 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人主页</title>
    <style>
        /* 全局简单样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.8;
            padding: 40px 20px;
        }
        /* 内容卡片容器 */
        .box {
            max-width: 700px;
            margin: 0 auto;
            background: #fff;
            padding: 45px;
            border-radius: 12px;
            box-shadow: 0 2px 12px #e2e8f0;
        }
        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 15px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 35px;
        }
        h2 {
            margin: 25px 0 12px;
            font-size: 20px;
            border-left: 4px solid #409eff;
            padding-left: 10px;
        }
        p {
            margin: 8px 0;
            color: #555;
        }
        a {
            color: #409eff;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        footer {
            text-align: center;
            margin-top: 40px;
            color: #999;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="box">
        <!-- 头部 -->
        <h1>你自己的名字</h1>
        <div class="subtitle">个人主页 | 日常记录 & 学习分享</div>

        <!-- 自我介绍区域 -->
        <h2>👋 关于我</h2>
        <p>大家好，这是我搭建在 GitHub Pages 上的个人网站。</p>
        <p>可以在这里记录学习笔记、日常感悟、项目总结。</p>

        <!-- 技能/爱好 -->
        <h2>💻 兴趣与技能</h2>
        <p>HTML / CSS / JavaScript</p>
        <p>电脑技术、编程学习、日常折腾各类工具</p>

        <!-- 联系方式 -->
        <h2>📮 联系我</h2>
        <p>GitHub：<a href="https://github.com/这里填你的Github用户名" target="_blank">github.com/你的用户名</a></p>
        <p>邮箱：xxx@qq.com</p>

        <!-- 页脚版权 -->
        <footer>
            © 2026 个人主页 | Powered by GitHub Pages
        </footer>
    </div>
</body>
</html>
